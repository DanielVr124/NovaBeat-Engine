<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaBeat V4 — Live Theme Switch Build</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070912;color:#eef4ff;font:16px/1.5 system-ui,Segoe UI,Arial}
#status{position:fixed;inset:0;display:grid;place-content:center;text-align:center;gap:10px;padding:24px;z-index:5;background:#070912}
#status small{color:#9eb0d4}#error{max-width:760px;color:#ff9eae;white-space:pre-wrap}
iframe{border:0;width:100%;height:100%;display:block;background:#070912}
</style>
</head>
<body>
<div id="status"><strong>Loading your original NovaBeat V4…</strong><small>Applying live theme switching while preserving the original embedded artwork and soundtrack.</small><div id="error"></div></div>
<iframe id="game" title="NovaBeat V4"></iframe>
<script>
(async()=>{
 const status=document.getElementById('status');
 const error=document.getElementById('error');
 const patches=[["<audio id=\"music\" preload=\"auto\" loop src=\"data:audio/ogg;base64,","<audio id=\"music\" autoplay preload=\"auto\" loop playsinline src=\"data:audio/ogg;base64,","Enable the browser's normal autoplay attempt for the embedded music."],["function setView(id){current=id;for(const v of VIEWS)$(v).classList.toggle('active',v===id);if(id==='homeView'){renderHome();}if(id==='classicView'){stopNovaMusicForClassic();renderClassic();}}\nfunction stopNovaMusicForClassic(){const t=music.volume;let n=0;const timer=setInterval(()=>{n++;music.volume=Math.max(0,t*(1-n/10));if(n>=10){clearInterval(timer);music.pause();music.volume=musicVolume*.65;}},35);}","function setView(id){current=id;for(const v of VIEWS)$(v).classList.toggle('active',v===id);if(id==='homeView'){renderHome();}if(id==='classicView'){renderClassic();}}","Keep the same music element playing when switching views."],["title.classList.toggle('fnf-title-active',menuStyle==='classic');\n if(menuStyle!=='classic')return;","title.classList.toggle('fnf-title-active',menuStyle==='classic');\n if(menuStyle!=='classic'){\n  if($('fnfTitleScreen')){$('fnfTitleScreen').remove();fnfTitleAnimationStarted=false;}\n  return;\n }","Make the Original FNF title treatment reversible when changing back to NovaBeat."],["const fnfOptionItems=['PREFERENCES','CONTROLS','LAG ADJUSTMENT','LOGIN TO NG','CLEAR SAVE DATA','EXIT'];","const fnfOptionItems=['PREFERENCES','CONTROLS','LAG ADJUSTMENT','LOGIN TO NG','CLEAR SAVE DATA','EXIT','MENU STYLE'];","Add a route back to NovaBeat in Original FNF Options."],["else if(i===4){classicNotice('CLEAR SAVE DATA?','This reference preview never touches game data. In FNF, this action deletes all local save data after confirmation.');}\n  else renderClassicMain();","else if(i===4){classicNotice('CLEAR SAVE DATA?','This reference preview never touches game data. In FNF, this action deletes all local save data after confirmation.');}\n  else if(i===6){switchMenuStyle('novabeat');}\n  else renderClassicMain();","Make the Original FNF Options style entry switch to NovaBeat."],["NovaBeat is the redesigned menu. Original FNF returns to the untouched upstream menu state after a restart. This preference is separate from visual customization.","Switch instantly between NovaBeat and Original FNF. Your menu soundtrack keeps playing.","Update the Menu Style helper text."],["id=\"applyStyle\" class=\"primary\" disabled>APPLY & RESTART","id=\"applyStyle\" class=\"primary\" disabled>APPLY STYLE","Remove restart wording from the style button."],["document.querySelectorAll('[data-style]').forEach(b=>b.addEventListener('click',()=>{pendingStyle=b.dataset.style;document.querySelectorAll('[data-style]').forEach(x=>x.classList.toggle('active',x===b));$('applyStyle').disabled=pendingStyle===menuStyle;$('stylePending').textContent=pendingStyle===menuStyle?'No changes to apply.':'The game will restart into '+(pendingStyle==='classic'?'the original FNF menu':'the NovaBeat menu')+'.';sfxPlay('select');}));\n$('applyStyle').addEventListener('click',()=>{if(pendingStyle===menuStyle)return;sfxPlay('apply');localStorage.setItem('novaMenuStyle',pendingStyle);$('restartText').textContent='Restarting into '+(pendingStyle==='classic'?'the original FNF menu':'the NovaBeat menu')+'. The preference will be remembered.';openOverlay('restartOverlay');setTimeout(()=>window.location.reload(),1150);});","document.querySelectorAll('[data-style]').forEach(b=>b.addEventListener('click',()=>{pendingStyle=b.dataset.style;document.querySelectorAll('[data-style]').forEach(x=>x.classList.toggle('active',x===b));$('applyStyle').disabled=pendingStyle===menuStyle;$('stylePending').textContent=pendingStyle===menuStyle?'No changes to apply.':'Switch to '+(pendingStyle==='classic'?'Original FNF':'NovaBeat')+' immediately, without restarting.';sfxPlay('select');}));\nfunction switchMenuStyle(nextStyle){\n if(nextStyle!=='classic'&&nextStyle!=='novabeat')return;\n if(nextStyle===menuStyle)return;\n menuStyle=nextStyle;pendingStyle=nextStyle;\n localStorage.setItem('novaMenuStyle',menuStyle);\n document.querySelectorAll('[data-style]').forEach(b=>b.classList.toggle('active',b.dataset.style===menuStyle));\n $('stylePending').textContent='Current menu style: '+(menuStyle==='classic'?'Original FNF':'NovaBeat')+'.';\n $('applyStyle').disabled=true;\n fnfShowTitleStyle();\n if(menuStyle==='classic'){\n  classicState.page='main';classicState.selected=0;\n  setView('classicView');\n }else{\n  selected=0;\n  setView('homeView');\n }\n}\n$('applyStyle').addEventListener('click',()=>{if(pendingStyle===menuStyle)return;sfxPlay('apply');switchMenuStyle(pendingStyle);});","Replace page reloads with immediate, bidirectional style switching."]];
 function replaceOnce(source,before,after,label){
   const first=source.indexOf(before);
   if(first<0)throw new Error('Could not find source section: '+label);
   if(source.indexOf(before,first+before.length)>=0)throw new Error('Source section is ambiguous: '+label);
   return source.slice(0,first)+after+source.slice(first+before.length);
 }
 try{
   const response=await fetch("https://raw.githubusercontent.com/DanielVr124/NovaBeat-Engine/main/web-builds/NovaBeatMenu.html",{cache:'no-store'});
   if(!response.ok)throw new Error('GitHub source download failed (HTTP '+response.status+').');
   let source=await response.text();
   if(!source.startsWith('<!doctype html>')||!source.includes('NovaBeat Engine'))throw new Error('The downloaded file does not look like the expected NovaBeat V4 HTML.');
   for(const [before,after,label] of patches)source=replaceOnce(source,before,after,label);
   document.getElementById('game').srcdoc=source;
   status.remove();
 }catch(err){
   error.textContent=String(err&&err.message||err);
   status.querySelector('strong').textContent='Could not load the original V4';
   status.querySelector('small').textContent='Check your internet connection and try opening this launcher again.';
 }
})();
</script>
</body>
</html>
