<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaBeat V4 — Live Theme Switch</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070912;color:#eef4ff;font:16px/1.5 system-ui,Segoe UI,Arial}
#status{position:fixed;inset:0;display:grid;place-content:center;text-align:center;gap:10px;padding:24px;z-index:5;background:#070912}
#status small{color:#9eb0d4}#error{max-width:760px;color:#ff9eae;white-space:pre-wrap}
iframe{border:0;width:100%;height:100%;display:block;background:#070912}
</style>
</head>
<body>
<div id="status"><strong>Loading NovaBeat V4…</strong><small>Loading the full embedded menu and applying live FNF/NovaBeat switching.</small><div id="error"></div></div>
<iframe id="game" title="NovaBeat V4"></iframe>
<script>
(async()=>{
 const status=document.getElementById('status');
 const error=document.getElementById('error');
 const patches=[["NovaBeat is the redesigned menu. Original FNF returns to the untouched upstream menu state after a restart. This preference is separate from visual customization.","Switch instantly between the NovaBeat menu and the original FNF title screen. No page reload is needed.","Update the Menu Style helper text."],["id=\"applyStyle\" class=\"primary\" disabled>APPLY & RESTART","id=\"applyStyle\" class=\"primary\" disabled>APPLY STYLE","Remove restart wording from the style button."],["document.querySelectorAll('[data-style]').forEach(b=>b.addEventListener('click',()=>{pendingStyle=b.dataset.style;document.querySelectorAll('[data-style]').forEach(x=>x.classList.toggle('active',x===b));$('applyStyle').disabled=pendingStyle===menuStyle;$('stylePending').textContent=pendingStyle===menuStyle?'No changes to apply.':'The game will restart into '+(pendingStyle==='classic'?'the original FNF menu':'the NovaBeat menu')+'.';sfxPlay('select');}));\n$('applyStyle').addEventListener('click',()=>{if(pendingStyle===menuStyle)return;sfxPlay('apply');localStorage.setItem('novaMenuStyle',pendingStyle);$('restartText').textContent='Restarting into '+(pendingStyle==='classic'?'the original FNF menu':'the NovaBeat menu')+'. The preference will be remembered.';openOverlay('restartOverlay');setTimeout(()=>window.location.reload(),1150);});","document.querySelectorAll('[data-style]').forEach(b=>b.addEventListener('click',()=>{pendingStyle=b.dataset.style;document.querySelectorAll('[data-style]').forEach(x=>x.classList.toggle('active',x===b));$('applyStyle').disabled=pendingStyle===menuStyle;$('stylePending').textContent=pendingStyle===menuStyle?'No changes to apply.':'Switch to '+(pendingStyle==='classic'?'Original FNF':'NovaBeat')+' immediately, without restarting.';sfxPlay('select');}));\n$('applyStyle').addEventListener('click',()=>{if(pendingStyle===menuStyle)return;switchMenuStyle(pendingStyle);});","Replace reload-based style switching."],["const fnfOptionItems=['PREFERENCES','CONTROLS','LAG ADJUSTMENT','LOGIN TO NG','CLEAR SAVE DATA','EXIT'];","const fnfOptionItems=['PREFERENCES','CONTROLS','LAG ADJUSTMENT','LOGIN TO NG','CLEAR SAVE DATA','EXIT','MENU STYLE'];","Add a way back to NovaBeat in FNF Options."],["else if(i===4){classicNotice('CLEAR SAVE DATA?','This reference preview never touches game data. In FNF, this action deletes all local save data after confirmation.');}\n  else renderClassicMain();","else if(i===4){classicNotice('CLEAR SAVE DATA?','This reference preview never touches game data. In FNF, this action deletes all local save data after confirmation.');}\n  else if(i===6){switchMenuStyle('novabeat');}\n  else renderClassicMain();","Route the FNF Options style item to NovaBeat."],["if(menuStyle!=='classic')return;\n if(!$('fnfTitleScreen')){","if(menuStyle!=='classic'){resetFNFTitlePresentation();return;}\n if(!$('fnfTitleScreen')){","Remove the FNF title layer when leaving classic mode."],["let fnfTitleAnimationStarted=false,fnfTitleLogoAtlas=null,fnfTitleGFAtlas=null,fnfTitlePromptImage=null,fnfTitleFrame=0,fnfTitleLast=0,fnfGFLast=0,fnfGFIndex=0,fnfGFDirection=0;","let fnfTitleAnimationStarted=false,fnfTitleResizeHandler=null,fnfTitleLogoAtlas=null,fnfTitleGFAtlas=null,fnfTitlePromptImage=null,fnfTitleFrame=0,fnfTitleLast=0,fnfGFLast=0,fnfGFIndex=0,fnfGFDirection=0;","Track and clean up the title resize handler."],["catch(err){console.warn('FNF title art load error',err);return;}\n const logoFrames=fnfFrames(fnfTitleLogoAtlas,'logo bumpin');","catch(err){console.warn('FNF title art load error',err);return;}\n if(!root.isConnected)return;\n const logoFrames=fnfFrames(fnfTitleLogoAtlas,'logo bumpin');","Ignore old title-art loads after a style change."],["fit();window.addEventListener('resize',fit);\n const render=now=>{\n  if(!$('fnfTitleScreen'))return;","if(fnfTitleResizeHandler)window.removeEventListener('resize',fnfTitleResizeHandler);\n fnfTitleResizeHandler=fit;fit();window.addEventListener('resize',fit);\n const render=now=>{\n  if(!root.isConnected)return;","Stop old FNF title animation loops and resize handlers."],["}\n\n// Unified keyboard navigation for the authentic FNF reference screens.\nwindow.addEventListener('keydown',e=>{","}\n\nfunction resetFNFTitlePresentation(){\n if(fnfTitleResizeHandler){window.removeEventListener('resize',fnfTitleResizeHandler);fnfTitleResizeHandler=null;}\n fnfTitleAnimationStarted=false;\n fnfTitleFrame=0;fnfTitleLast=0;fnfGFLast=0;fnfGFIndex=0;fnfGFDirection=0;\n $('fnfTitleScreen')?.remove();\n}\n\nfunction switchMenuStyle(nextStyle){\n if(nextStyle!=='classic'&&nextStyle!=='novabeat')return;\n if(nextStyle===menuStyle){\n  pendingStyle=menuStyle;\n  document.querySelectorAll('[data-style]').forEach(b=>b.classList.toggle('active',b.dataset.style===menuStyle));\n  $('stylePending').textContent='Current menu style: '+(menuStyle==='classic'?'Original FNF':'NovaBeat')+'.';\n  $('applyStyle').disabled=true;\n  return;\n }\n menuStyle=nextStyle;\n pendingStyle=nextStyle;\n localStorage.setItem('novaMenuStyle',menuStyle);\n document.querySelectorAll('[data-style]').forEach(b=>b.classList.toggle('active',b.dataset.style===menuStyle));\n $('stylePending').textContent='Current menu style: '+(menuStyle==='classic'?'Original FNF':'NovaBeat')+'.';\n $('applyStyle').disabled=true;\n closeOverlay('restartOverlay');\n $('titleView').classList.remove('entering');\n $('fnfTitleScreen')?.classList.remove('fnf-title-confirmed');\n resetFNFTitlePresentation();\n titleAudioPrimed=false;\n sfxPlay('apply');\n if(menuStyle==='classic'){\n  classicState.page='main';classicState.selected=0;classicState.optionsPage='root';classicState.optionIndex=0;\n  fnfBindingCapture=null;\n  try{music.pause();music.currentTime=0;}catch(err){}\n  fnfShowTitleStyle();\n  setView('titleView');\n }else{\n  selected=0;\n  fnfShowTitleStyle();\n  setView('homeView');\n }\n}\n\n// Unified keyboard navigation for the authentic FNF reference screens.\nwindow.addEventListener('keydown',e=>{","Add the live, bidirectional style controller."]];
 function replaceOnce(source,before,after,label){
  const first=source.indexOf(before);
  if(first<0)throw new Error('Could not find source section: '+label);
  if(source.indexOf(before,first+before.length)>=0)throw new Error('Source section is ambiguous: '+label);
  return source.slice(0,first)+after+source.slice(first+before.length);
 }
 try{
  const sourceUrl="https://raw.githubusercontent.com/DanielVr124/NovaBeat-Engine/4fba99034715da2c32b9fd32ed318b5dc976119f/web-builds/NovaBeatMenu.html";
  const response=await fetch(sourceUrl,{cache:'no-store'});
  if(!response.ok)throw new Error('GitHub source download failed (HTTP '+response.status+').');
  let source=await response.text();
  if(!source.startsWith('<!doctype html>')||!source.includes('NovaBeat Engine'))throw new Error('The downloaded file is not the expected full NovaBeat V4 source.');
  for(const [before,after,label] of patches)source=replaceOnce(source,before,after,label);
  document.getElementById('game').srcdoc=source;
  status.remove();
 }catch(err){
  error.textContent=String(err&&err.message||err);
  status.querySelector('strong').textContent='Could not load NovaBeat V4';
  status.querySelector('small').textContent='Check your internet connection and try opening this launcher again.';
 }
})();
</script>
</body>
</html>
