name: NovaBeat platform build checks

# [full-build-windows] Compile-check Psych Freeplay and the current Lua runtime regression coverage.

# [full-build-android] Verify APK compilation without HXCPP precompiled headers.

# [full-build] Build Windows and Android for the current native test pass.
# [full-build] Validate Windows and Android after Haxe/Neko tool-cache priming.
# Reuse dependency and tool caches without clearing the restored local Haxe repository.
# Android-only validation run requested after the NovaBeat menu compiler fixes.
# [full-build-android] Rebuild Android after adding the native TouchUtil stub.
# Android-only builds can be requested with workflow_dispatch (build_target: android)
# or by pushing a change with [full-build-android] in its commit message.

on:
  workflow_dispatch:
    inputs:
# Psych compatibility testing requires native filesystem access to discover installed mods; use the Windows target for real-mod validation.
      build_target:
        description: Which native platform(s) to build
        required: true
        type: choice
        options:
          - both
          - windows
          - android
          - publish-windows
        default: both
      source_sha:
        description: Commit SHA of the cached Windows build to republish; blank uses the selected branch HEAD
        required: false
        type: string
  push:
    branches: [main, "feature/**"]
    paths:
      - ".gitmodules"
      - "upstream/Funkin/**"
      - "novabeat-assets/psych-freeplay/**"
      - ".github/workflows/novabeat-platform-builds.yml"
      - "docs/BUILDING.md"
      - "README.md"
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - ".gitmodules"
      - "upstream/Funkin/**"
      - "novabeat-assets/psych-freeplay/**"
      - ".github/workflows/novabeat-platform-builds.yml"
      - "docs/BUILDING.md"

permissions:
  contents: read

concurrency:
  group: novabeat-platform-builds-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  windows:
    if: (github.event_name == 'workflow_dispatch' && (inputs.build_target == 'both' || inputs.build_target == 'windows')) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[full-build]') || contains(github.event.head_commit.message, '[full-build-windows]'))) || (github.event_name == 'pull_request' && (contains(github.event.pull_request.title, '[full-build]') || contains(github.event.pull_request.title, '[full-build-windows]')))
    name: Windows desktop
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Check out NovaBeat and pinned FNF asset repositories
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install classic Psych Freeplay assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = "novabeat-assets/psych-freeplay/shared"
          $destination = "upstream/Funkin/assets/shared"
          foreach ($folder in @("images", "sounds")) {
            $sourceFolder = Join-Path $source $folder
            $destinationFolder = Join-Path $destination $folder
            New-Item -ItemType Directory -Force -Path $destinationFolder | Out-Null
            Get-ChildItem -LiteralPath $sourceFolder -File | Copy-Item -Destination $destinationFolder -Force
          }
          if (!(Test-Path "upstream/Funkin/assets/fonts/vcr.ttf")) { throw "VCR font is missing from the pinned FNF assets." }

      - name: Restore Neko 2.4.0 tool cache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/neko/2.4.0
          key: ${{ runner.os }}-${{ runner.arch }}-neko-2.4.0-v1
          save-always: true

      - name: Prime Neko tool cache with extended download retries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tool_cache="${RUNNER_TOOL_CACHE:?RUNNER_TOOL_CACHE is not set}"
          neko_root="$tool_cache/neko/2.4.0"
          neko_path="$neko_root/x64"

          if [[ -x "$neko_path/neko" && -f "$neko_root/x64.complete" ]]; then
            echo "Neko 2.4.0 is already restored from the runner tool cache."
            exit 0
          fi

          archive="$RUNNER_TEMP/neko-2.4.0-linux64.tar.gz"
          extract="$RUNNER_TEMP/neko-2.4.0-extract"
          rm -rf "$extract"
          mkdir -p "$extract"

          # setup-haxe v2 retries transient downloads three times. Neko's release
          # endpoint has repeatedly returned HTTP 504 in CI, so prime the exact
          # actions/tool-cache location with a longer retry window first.
          curl -fL --retry 12 --retry-all-errors --retry-delay 5 --retry-max-time 900 \
            "https://github.com/HaxeFoundation/neko/releases/download/v2-4-0/neko-2.4.0-linux64.tar.gz" \
            -o "$archive"

          tar -xzf "$archive" -C "$extract"
          archive_root="$(find "$extract" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$archive_root"
          test -x "$archive_root/neko"

          mkdir -p "$neko_root"
          rm -rf "$neko_path"
          cp -a "$archive_root" "$neko_path"
          touch "$neko_root/x64.complete"
          echo "$neko_path" >> "$GITHUB_PATH"

      - name: Restore Windows Neko 2.4.0 tool cache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/neko/2.4.0
          key: ${{ runner.os }}-${{ runner.arch }}-neko-2.4.0-v1
          save-always: true

      - name: Prime Windows Neko tool cache with extended download retries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $toolCache = $env:RUNNER_TOOL_CACHE
          if ([string]::IsNullOrWhiteSpace($toolCache)) { throw "RUNNER_TOOL_CACHE is not set." }
          $nekoRoot = Join-Path $toolCache "neko/2.4.0"
          $nekoPath = Join-Path $nekoRoot "x64"
          $marker = Join-Path $nekoRoot "x64.complete"

          if ((Test-Path (Join-Path $nekoPath "neko.exe")) -and (Test-Path $marker)) {
            Write-Host "Neko 2.4.0 is already restored from the runner tool cache."
          } else {
            $archive = Join-Path $env:RUNNER_TEMP "neko-2.4.0-win64.zip"
            $extract = Join-Path $env:RUNNER_TEMP "neko-2.4.0-extract"
            if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $extract | Out-Null

            & curl.exe -fL --retry 12 --retry-all-errors --retry-delay 5 --retry-max-time 900 "https://github.com/HaxeFoundation/neko/releases/download/v2-4-0/neko-2.4.0-win64.zip" --output $archive
            if ($LASTEXITCODE -ne 0) { throw "Neko download failed with curl exit code $LASTEXITCODE." }

            Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
            $nekoBinary = Get-ChildItem -LiteralPath $extract -Filter "neko.exe" -File -Recurse | Select-Object -First 1
            if ($null -eq $nekoBinary) { throw "neko.exe was not found in the Neko archive." }
            $nekoSource = $nekoBinary.DirectoryName

            New-Item -ItemType Directory -Force -Path $nekoPath | Out-Null
            Get-ChildItem -LiteralPath $nekoSource -Force | Copy-Item -Destination $nekoPath -Recurse -Force
            if (!(Test-Path (Join-Path $nekoPath "neko.exe"))) { throw "Neko cache does not contain neko.exe." }

            New-Item -ItemType File -Force -Path $marker | Out-Null
          }

      - name: Restore Haxe 4.3.7 tool cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/haxe/4.3.7
          key: ${{ runner.os }}-${{ runner.arch }}-haxe-4.3.7-v1
          save-always: true

      - name: Prime Windows Haxe tool cache with extended download retries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $toolCache = $env:RUNNER_TOOL_CACHE
          if ([string]::IsNullOrWhiteSpace($toolCache)) { throw "RUNNER_TOOL_CACHE is not set." }
          $haxeRoot = Join-Path $toolCache "haxe/4.3.7"
          $haxePath = Join-Path $haxeRoot "x64"
          $marker = Join-Path $haxeRoot "x64.complete"

          if ((Test-Path (Join-Path $haxePath "haxe.exe")) -and (Test-Path (Join-Path $haxePath "std")) -and (Test-Path $marker)) {
            Write-Host "Haxe 4.3.7 is already restored from the runner tool cache."
          } else {
            $archive = Join-Path $env:RUNNER_TEMP "haxe-4.3.7-win64.zip"
            $extract = Join-Path $env:RUNNER_TEMP "haxe-4.3.7-extract"
            if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $extract | Out-Null

            & curl.exe -fL --retry 12 --retry-all-errors --retry-delay 5 --retry-max-time 900 "https://github.com/HaxeFoundation/haxe/releases/download/4.3.7/haxe-4.3.7-win64.zip" --output $archive
            if ($LASTEXITCODE -ne 0) { throw "Haxe download failed with curl exit code $LASTEXITCODE." }

            Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
            $haxeBinary = Get-ChildItem -LiteralPath $extract -Filter "haxe.exe" -File -Recurse | Select-Object -First 1
            if ($null -eq $haxeBinary) { throw "haxe.exe was not found in the Haxe archive." }
            $haxeSource = $haxeBinary.DirectoryName
            if (!(Test-Path (Join-Path $haxeSource "std"))) { throw "The Haxe archive is missing its std directory." }

            New-Item -ItemType Directory -Force -Path $haxePath | Out-Null
            Get-ChildItem -LiteralPath $haxeSource -Force | Copy-Item -Destination $haxePath -Recurse -Force
            if (!(Test-Path (Join-Path $haxePath "haxe.exe"))) { throw "Haxe cache does not contain haxe.exe." }

            New-Item -ItemType File -Force -Path $marker | Out-Null
          }

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: "4.3.7"

      - name: Locate global Haxe library repository
        id: haxelib-cache-path
        shell: bash
        run: |
          set -euo pipefail
          haxelib_repo="$(haxelib config)"
          test -n "$haxelib_repo"
          echo "path=$haxelib_repo" >> "$GITHUB_OUTPUT"

      - name: Restore Haxe libraries and Lime tool caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.haxelib-cache-path.outputs.path }}
            upstream/Funkin/.haxelib
            ~/.lime
          key: ${{ runner.os }}-haxe-4.3.7-${{ hashFiles('upstream/Funkin/hmm.json') }}

      - name: Confirm upstream assets were checked out
        shell: bash
        run: |
          set -euo pipefail
          test -f upstream/Funkin/source/Main.hx
          test -f upstream/Funkin/project.hxp
          test -f upstream/Funkin/LICENSE.md
          test -f upstream/Funkin/assets/LICENSE.md
          test -f upstream/Funkin/art/LICENSE.md

      - name: Install classic Psych Freeplay assets
        shell: bash
        run: |
          set -euo pipefail
          source="novabeat-assets/psych-freeplay/shared"
          destination="upstream/Funkin/assets/shared"
          test -s "$source/images/menuDesat.png"
          test -s "$source/images/alphabet.png"
          test -s "$source/images/alphabet.xml"
          test -s "$source/sounds/scrollMenu.ogg"
          mkdir -p "$destination/images" "$destination/sounds"
          cp "$source/images/"* "$destination/images/"
          cp "$source/sounds/"* "$destination/sounds/"
          test -s upstream/Funkin/assets/fonts/vcr.ttf

      - name: Configure patched Haxe libraries and install pinned dependencies
        shell: bash
        working-directory: upstream/Funkin
        run: |
          set -euo pipefail
          haxelib fixrepo --global || true
          haxelib --debug --never --global install haxelib 4.1.0
          haxelib --debug --never --global set haxelib 4.1.0
          haxelib --global remove haxelib git || true
          haxelib --global remove hmm || true
          haxelib --debug --never --global git haxelib https://github.com/FunkinCrew/haxelib.git funkin-patches --skip-dependencies
          haxelib --debug --never --global git hmm https://github.com/FunkinCrew/hmm funkin-patches
          if [[ ! -d .haxelib ]]; then
            haxelib --debug --never newrepo
          fi
          haxelib --global run hmm install -q

      - name: Compile HXCPP support tools
        shell: bash
        working-directory: upstream/Funkin
        run: |
          set -euo pipefail
          cd .haxelib/hxcpp/git/tools/hxcpp
          haxe compile.hxml

      - name: Build Lime native tools
        timeout-minutes: 45
        shell: bash
        working-directory: upstream/Funkin
        run: |
          set -euo pipefail
          haxelib run lime rebuild cpp -64

      - name: Build Windows release
        shell: bash
        working-directory: upstream/Funkin
        run: |
          set -euo pipefail
          haxelib run lime build windows -v -release -DGITHUB_BUILD

      - name: Verify Windows executable
        shell: bash
        working-directory: upstream/Funkin
        run: |
          set -euo pipefail
          exe="export/release/windows/bin/Funkin.exe"
          test -s "$exe"
          digest="$(sha256sum "$exe" | awk '{print $1}')"
          {
            echo "## Windows desktop build succeeded"
            echo
            echo "- Output: $exe"
            echo "- SHA-256: `$digest`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Windows distribution folder
        shell: pwsh
        working-directory: upstream/Funkin
        run: |
          $ErrorActionPreference = "Stop"
          $binaryDir = "export/release/windows/bin"
          $exe = Join-Path $binaryDir "Funkin.exe"
          if (!(Test-Path $exe)) { throw "Windows executable missing: $exe" }
          $files = @(Get-ChildItem $binaryDir -File -Recurse)
          if ($files.Count -lt 1) { throw "Windows distribution folder is empty" }
          "Windows distribution files: $($files.Count)" >> $env:GITHUB_STEP_SUMMARY
          foreach ($file in $files) {
            $relative = $file.FullName.Substring((Resolve-Path $binaryDir).Path.Length).TrimStart('\', '/')
            "- $relative ($($file.Length) bytes)" >> $env:GITHUB_STEP_SUMMARY
          }

      # Keep a commit-scoped recovery copy before attempting the user download.
      # If the artifact service fails, publish-windows can restore this cache and
      # upload it again without rerunning Haxe/Lime or compiling the game.
      - name: Preserve Windows distribution for upload-only recovery
        id: preserve-windows
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: upstream/Funkin/export/release/windows/bin/
          key: novabeat-windows-dist-${{ github.sha }}

      - name: Record Windows recovery-cache status
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.preserve-windows.outcome }}" -eq "success") {
            "Windows distribution recovery cache: saved or already present." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "Windows distribution recovery cache: unavailable; the primary artifact upload will still be attempted." >> $env:GITHUB_STEP_SUMMARY
          }

      # Store binaries without spending runner time recompressing assets.
      # The commit-keyed cache above is the retry source if this transfer fails.
      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: NovaBeat-Windows
          path: upstream/Funkin/export/release/windows/bin/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish_windows:
    if: github.event_name == 'workflow_dispatch' && inputs.build_target == 'publish-windows'
    name: Re-publish cached Windows build
    runs-on: windows-2022
    steps:
      - name: Restore cached Windows distribution
        id: restore-windows
        uses: actions/cache/restore@v4
        with:
          path: upstream/Funkin/export/release/windows/bin/
          key: novabeat-windows-dist-${{ inputs.source_sha || github.sha }}

      - name: Verify restored Windows distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ steps.restore-windows.outputs.cache-hit }}" -ne "true") {
            throw "No cached Windows distribution exists for SHA '${{ inputs.source_sha || github.sha }}'. Select the branch and SHA used by the original Windows build, then run publish-windows."
          }
          $binaryDir = "upstream/Funkin/export/release/windows/bin"
          $exe = Join-Path $binaryDir "Funkin.exe"
          if (!(Test-Path $exe)) { throw "Cached Windows executable is missing: $exe" }
          $files = @(Get-ChildItem -LiteralPath $binaryDir -File -Recurse)
          if ($files.Count -lt 1) { throw "Cached Windows distribution is empty." }
          $digest = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "Republished build SHA: ${{ inputs.source_sha || github.sha }}" >> $env:GITHUB_STEP_SUMMARY
          "Windows files restored: $($files.Count)" >> $env:GITHUB_STEP_SUMMARY
          "Funkin.exe SHA-256: $digest" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: NovaBeat-Windows
          path: upstream/Funkin/export/release/windows/bin/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  android:
    if: (github.event_name == 'workflow_dispatch' && (inputs.build_target == 'both' || inputs.build_target == 'android')) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[full-build]') || contains(github.event.head_commit.message, '[full-build-android]'))) || (github.event_name == 'pull_request' && (contains(github.event.pull_request.title, '[full-build]') || contains(github.event.pull_request.title, '[full-build-android]')))
    name: Android mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out NovaBeat and pinned FNF asset repositories
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Restore the pinned Android toolchain before setup-android runs. This avoids
      # downloading the same SDK platforms, build-tools, and NDK on every build.
      - name: Restore Android SDK and NDK package cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/cmdline-tools
            /usr/local/lib/android/sdk/platform-tools
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/build-tools
            /usr/local/lib/android/sdk/ndk
          key: android-sdk-ubuntu-24.04-cmdline-15859902-api29-api35-build35-ndk25c
          save-always: true

      - name: Set up Android SDK, build tools, and the Lime-compatible NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-29 platforms;android-35 build-tools;35.0.0 ndk;25.2.9519653"

      - name: Configure Android SDK and NDK paths
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          ndk_root="$sdk_root/ndk/25.2.9519653"
          test -d "$sdk_root/platforms/android-35"
          test -d "$ndk_root"
          {
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
            echo "ANDROID_SDK=$sdk_root"
            echo "ANDROID_NDK_HOME=$ndk_root"
            echo "ANDROID_NDK_ROOT=$ndk_root"
            echo "ANDROID_NDK=$ndk_root"
          } >> "$GITHUB_ENV"

      - name: Confirm upstream assets were checked out
        shell: bash
        run: |
          set -euo pipefail
          test -f upstream/Funkin/source/Main.hx
          test -f upstream/Funkin/project.hxp
          test -f upstream/Funkin/LICENSE.md
          test -f upstream/Funkin/assets/LICENSE.md
          test -f upstream/Funkin/art/LICENSE.md

      - name: Restore Neko 2.4.0 tool cache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/neko/2.4.0
          key: ${{ runner.os }}-${{ runner.arch }}-neko-2.4.0-v1
          save-always: true

      - name: Prime Neko tool cache with extended download retries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tool_cache="${RUNNER_TOOL_CACHE:?RUNNER_TOOL_CACHE is not set}"
          neko_root="$tool_cache/neko/2.4.0"
          neko_path="$neko_root/x64"

          if [[ -x "$neko_path/neko" && -f "$neko_root/x64.complete" ]]; then
            echo "Neko 2.4.0 is already restored from the runner tool cache."
            exit 0
          fi

          archive="$RUNNER_TEMP/neko-2.4.0-linux64.tar.gz"
          extract="$RUNNER_TEMP/neko-2.4.0-extract"
          rm -rf "$extract"
          mkdir -p "$extract"

          # setup-haxe v2 retries transient downloads three times. Neko's release
          # endpoint has repeatedly returned HTTP 504 in CI, so prime the exact
          # actions/tool-cache location with a longer retry window first.
          curl -fL --retry 12 --retry-all-errors --retry-delay 5 --retry-max-time 900 \
            "https://github.com/HaxeFoundation/neko/releases/download/v2-4-0/neko-2.4.0-linux64.tar.gz" \
            -o "$archive"

          tar -xzf "$archive" -C "$extract"
          archive_root="$(find "$extract" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$archive_root"
          test -x "$archive_root/neko"

          mkdir -p "$neko_root"
          rm -rf "$neko_path"
          cp -a "$archive_root" "$neko_path"
          touch "$neko_root/x64.complete"
          echo "$neko_path" >> "$GITHUB_PATH"

      - name: Restore Haxe 4.3.7 tool cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/haxe/4.3.7
          key: ${{ runner.os }}-${{ runner.arch }}-haxe-4.3.7-v1
          save-always: true

      - name: Prime Linux Haxe tool cache with extended download retries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tool_cache="${RUNNER_TOOL_CACHE:?RUNNER_TOOL_CACHE is not set}"
          haxe_root="$tool_cache/haxe/4.3.7"
          haxe_path="$haxe_root/x64"

          if [[ -x "$haxe_path/haxe" && -d "$haxe_path/std" && -f "$haxe_root/x64.complete" ]]; then
            echo "Haxe 4.3.7 is already restored from the runner tool cache."
            exit 0
          fi

          archive="$RUNNER_TEMP/haxe-4.3.7-linux64.tar.gz"
          extract="$RUNNER_TEMP/haxe-4.3.7-extract"
          rm -rf "$extract"
          mkdir -p "$extract"

          # setup-haxe v2 retries downloads three times for at most 90 seconds.
          # The Haxe release asset has repeatedly returned HTTP 504 in CI, so
          # download with a longer retry window and prime actions/tool-cache's
          # exact haxe/<version>/x64 layout before setup-haxe runs.
          curl -fL --retry 12 --retry-all-errors --retry-delay 5 --retry-max-time 900 \
            "https://github.com/HaxeFoundation/haxe/releases/download/4.3.7/haxe-4.3.7-linux64.tar.gz" \
            -o "$archive"

          tar -xzf "$archive" -C "$extract"
          haxe_binary="$(find "$extract" -type f -name haxe -print -quit)"
          test -n "$haxe_binary"
          haxe_source="$(dirname "$haxe_binary")"
          test -d "$haxe_source/std"

          mkdir -p "$haxe_root"
          rm -rf "$haxe_path"
          mkdir -p "$haxe_path"
          cp -a "$haxe_source/." "$haxe_path/"
          test -x "$haxe_path/haxe"
          test -d "$haxe_path/std"
          touch "$haxe_root/x64.complete"
          echo "$haxe_path" >> "$GITHUB_PATH"

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: "4.3.7"

      - name: Locate global Haxe library repository
        id: haxelib-cache-path
        shell: bash
        run: |
          set -euo pipefail
          haxelib_repo="$(haxelib config)"
          test -n "$haxelib_repo"
          echo "path=$haxelib_repo" >> "$GITHUB_OUTPUT"

      - name: Restore Haxe libraries and Lime tool caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.haxelib-cache-path.outputs.path }}
            upstream/Funkin/.haxelib
            ~/.lime
          key: ${{ runner.os }}-haxe-4.3.7-${{ hashFiles('upstream/Funkin/hmm.json') }}

      - name: Configure patched Haxe libraries and install pinned dependencies
        shell: bash
        working-directory: upstream/Funkin
        run: |
          set -euo pipefail
          haxelib fixrepo --global || true
          haxelib --debug --never --global install haxelib 4.1.0
          haxelib --debug --never --global set haxelib 4.1.0
          haxelib --global remove haxelib git || true
          haxelib --global remove hmm || true
          haxelib --debug --never --global git haxelib https://github.com/FunkinCrew/haxelib.git funkin-patches --skip-dependencies
          haxelib --debug --never --global git hmm https://github.com/FunkinCrew/hmm funkin-patches
          if [[ ! -d .haxelib ]]; then
            haxelib --debug --never newrepo
          fi
          haxelib --global run hmm install -q

      - name: Install complete SDL and Lime Linux development dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential g++ gcc g++-multilib gcc-multilib git make pkg-config cmake ninja-build \
            libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxinerama-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libglu1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libvulkan-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev \
            libpipewire-0.3-dev libspa-0.2-dev libwayland-dev libwayland-bin wayland-protocols libdecor-0-dev liburing-dev
          for header in \
            /usr/include/X11/extensions/scrnsaver.h \
            /usr/include/libudev.h \
            /usr/include/wayland-client.h \
            /usr/include/alsa/asoundlib.h \
            /usr/include/pulse/pulseaudio.h; do
            if [[ ! -f "$header" ]]; then
              echo "::error title=Missing SDL development header::$header was not installed"
              exit 1
            fi
          done
          pkg-config --exists libpipewire-0.3 libudev wayland-client alsa libpulse
          # Ubuntu stores PipeWire headers in a versioned include directory.
          # Use pkg-config's flags, exactly as the native compiler should.
          cat <<'EOF' | cc $(pkg-config --cflags libpipewire-0.3) -x c -fsyntax-only -
          #include <pipewire/pipewire.h>
          EOF
          command -v wayland-scanner
          wayland-scanner --version
      - name: Compile HXCPP support tools
        shell: bash
        working-directory: upstream/Funkin
        run: |
          set -euo pipefail
          cd .haxelib/hxcpp/git/tools/hxcpp
          haxe compile.hxml

      - name: Build Lime native tools
        shell: bash
        working-directory: upstream/Funkin
        run: |
          set -euo pipefail
          haxelib run lime rebuild cpp -64

      - name: Restore Android Gradle dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-ubuntu-24.04-jdk17-ndk25c-${{ hashFiles('upstream/Funkin/hmm.json') }}

      - name: Configure Lime Android SDK paths
        shell: bash
        working-directory: upstream/Funkin
        run: |
          set -euo pipefail
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_ROOT"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Patch OpenAL format detection for Android libc++
        shell: bash
        working-directory: upstream/Funkin
        run: |
          set -euo pipefail
          lime_project=".haxelib/lime/git/project"
          header="$lime_project/lib/openal/common/alformat.hpp"
          test -s "$header"

          python3 - "$header" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()
          needle = "#if (defined(MAC_OS_X_VERSION_MIN_REQUIRED) && MAC_OS_X_VERSION_MIN_REQUIRED < 130300)"
          if needle in source:
              replacement = "#if defined(__ANDROID__) || " + chr(92) + "\n    " + needle[len("#if "):]
              source = source.replace(needle, replacement, 1)
          elif "defined(__ANDROID__)" not in source:
              raise SystemExit("OpenAL alformat.hpp did not match the expected pinned source; refusing an unsafe patch.")
          path.write_text(source)
          if "defined(__ANDROID__)" not in source or '#include "fmt/format.h"' not in source:
              raise SystemExit("Android fmt fallback was not installed as expected.")
          print(f"Patched {path}")
          PY

          python3 - "$lime_project/lib/openal/common/alstring.cpp" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()
          start = source.find("namespace al {")
          end_marker = "} // namespace al"
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("OpenAL alstring.cpp namespace block not found; refusing an unsafe patch.")
          end += len(end_marker)
          old = source[start:end]
          if old.count("std::lexicographical_compare_three_way") != 2:
              raise SystemExit("Unexpected OpenAL case_compare implementation; refusing an unsafe patch.")
          replacement = """namespace al {

          auto case_compare(const std::string_view str0, const std::string_view str1) noexcept
              -> std::weak_ordering
          {
              using Traits = std::string_view::traits_type;
              std::size_t i{};
              while(i < str0.size() && i < str1.size())
              {
                  const auto ch0 = std::toupper(Traits::to_int_type(str0[i]));
                  const auto ch1 = std::toupper(Traits::to_int_type(str1[i]));
                  if(ch0 < ch1) return std::weak_ordering::less;
                  if(ch0 > ch1) return std::weak_ordering::greater;
                  ++i;
              }
              if(str0.size() < str1.size()) return std::weak_ordering::less;
              if(str0.size() > str1.size()) return std::weak_ordering::greater;
              return std::weak_ordering::equivalent;
          }

          auto case_compare(const std::wstring_view str0, const std::wstring_view str1) noexcept
              -> std::weak_ordering
          {
              using Traits = std::wstring_view::traits_type;
              std::size_t i{};
              while(i < str0.size() && i < str1.size())
              {
                  const auto ch0 = std::towupper(Traits::to_int_type(str0[i]));
                  const auto ch1 = std::towupper(Traits::to_int_type(str1[i]));
                  if(ch0 < ch1) return std::weak_ordering::less;
                  if(ch0 > ch1) return std::weak_ordering::greater;
                  ++i;
              }
              if(str0.size() < str1.size()) return std::weak_ordering::less;
              if(str0.size() > str1.size()) return std::weak_ordering::greater;
              return std::weak_ordering::equivalent;
          }

          } // namespace al"""
          path.write_text(source[:start] + replacement + source[end:])
          patched = path.read_text()
          if "std::lexicographical_compare_three_way" in patched:
              raise SystemExit("OpenAL three-way standard algorithm remains in alstring.cpp.")
          if patched.count("auto case_compare(") != 2:
              raise SystemExit("Expected both narrow and wide case_compare overloads.")
          print(f"Patched Android-compatible case_compare in {path}")
          PY

          # NDK r25 libc++ predates the C++20 iterator and floating-point concepts.
          # PFFFT only uses these for parameter constraints, so generic abbreviated
          # parameters retain the same call behavior without requiring libc++ concepts.
          python3 - "$lime_project/lib/openal/common/pffft.h" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()
          substitutions = {
              "std::contiguous_iterator auto": "auto",
              "std::floating_point auto": "auto",
          }
          for old, new in substitutions.items():
              count = source.count(old)
              if count == 0:
                  raise SystemExit(f"PFFFT declaration did not contain expected token {old!r}; refusing an unsafe patch.")
              source = source.replace(old, new)
          path.write_text(source)
          patched = path.read_text()
          if any(token in patched for token in substitutions):
              raise SystemExit("PFFFT C++20 concept constraints remain after Android compatibility patch.")
          print(f"Removed unsupported PFFFT concepts from Android header {path}")
          PY

          # NDK r25 libc++ does not provide <numbers>. Replace its two standard
          # constants with the exact float/double literals used by PFFFT.
          python3 - "$lime_project/lib/openal/common/pffft.cpp" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()
          include = "#include <numbers>"
          sqrt2 = "std::numbers::sqrt2_v<float>"
          pi = "std::numbers::pi"
          if source.count(include) != 1:
              raise SystemExit("PFFFT <numbers> include did not match the pinned source; refusing an unsafe patch.")
          if source.count(sqrt2) == 0 or source.count(pi) == 0:
              raise SystemExit("PFFFT numeric constant usage did not match the pinned source; refusing an unsafe patch.")
          source = source.replace(include + "\n", "")
          source = source.replace(sqrt2, "1.4142135623730950488f")
          source = source.replace(pi, "3.14159265358979323846")
          path.write_text(source)
          patched = path.read_text()
          if include in patched or "std::numbers::" in patched:
              raise SystemExit("PFFFT still references the unavailable <numbers> API after Android compatibility patch.")
          print(f"Replaced PFFFT std::numbers constants with equivalent literals in {path}")
          PY

          # NDK r25 libc++ is missing parts of the standard concepts library.
          # Re-express the OpenAL altypes concepts locally using type_traits so
          # the checks retain their standard semantics on Android.
          python3 - "$lime_project/lib/openal/common/altypes.hpp" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()
          anchor = "struct narrowing_error : std::runtime_error {"
          if source.count(anchor) != 1:
              raise SystemExit("OpenAL altypes.hpp narrowing_error anchor did not match; refusing an unsafe patch.")
          compatibility = """template<typename T, typename U>
          concept same_as = std::is_same_v<T, U> and std::is_same_v<U, T>;

          template<typename T>
          concept integral = std::is_integral_v<T>;

          template<typename T>
          concept floating_point = std::is_floating_point_v<T>;

          template<typename T>
          concept signed_integral = integral<T> and std::is_signed_v<T>;

          template<typename T>
          concept unsigned_integral = integral<T> and std::is_unsigned_v<T>;

          template<typename Derived, typename Base>
          concept derived_from = std::is_base_of_v<Base, Derived>
              and std::is_convertible_v<const volatile Derived*, const volatile Base*>;

          struct narrowing_error : std::runtime_error {"""
          source = source.replace(anchor, compatibility, 1)
          for standard, local in (
              ("std::same_as", "same_as"),
              ("std::integral", "integral"),
              ("std::floating_point", "floating_point"),
              ("std::signed_integral", "signed_integral"),
              ("std::unsigned_integral", "unsigned_integral"),
              ("std::derived_from", "derived_from"),
          ):
              if standard not in source:
                  raise SystemExit(f"Expected {standard} in altypes.hpp; refusing an unsafe patch.")
              source = source.replace(standard, local)
          path.write_text(source)
          if any(token in source for token in (
              "std::same_as", "std::integral", "std::floating_point",
              "std::signed_integral", "std::unsigned_integral", "std::derived_from"
          )):
              raise SystemExit("Unsupported standard concept references remain in Android altypes.hpp.")
          print(f"Installed Android-local standard-concept equivalents in {path}")
          PY

          cd "$lime_project"
          clang="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          test -x "$clang"
          probe="$RUNNER_TEMP/novabeat-openal-format-check.cpp"
          cat > "$probe" <<'CPP'
          #include "common/alformat.hpp"
          #include "common/altypes.hpp"
          #include "common/pffft.h"
          void novabeat_format_check() { (void)al::format("OpenAL {}", 1); }
          CPP
          "$clang" --target=aarch64-linux-android28 -std=c++20 -D__ANDROID__ -Ilib/openal -Ilib/openal/fmt-11.2.0/include -fsyntax-only "$probe"

      - name: Build Lime Android native libraries
        timeout-minutes: 45
        shell: bash
        working-directory: upstream/Funkin
        run: |
          set -euo pipefail
          # Reuse the Lime Android native libraries restored from the Haxe/Lime cache.
          # Do not pass -clean here: it deletes the cached outputs on every run.
          haxelib run lime rebuild android -v
          ndll=".haxelib/lime/git/ndll/Android"
          if [[ ! -s "$ndll/liblime-64.so" ]]; then
            echo "::error title=Android Lime ARM64 library missing::Lime rebuild completed without producing $ndll/liblime-64.so"
            find "$ndll" -maxdepth 1 -type f -printf '%f (%s bytes)\\n' 2>/dev/null || true
            exit 1
          fi
          echo "Verified Android ARM64 Lime library: $ndll/liblime-64.so"

      - name: Build Android debug APK
        shell: bash
        working-directory: upstream/Funkin
        env:
          # Keep HXCPP's Android C++ compiler serial and avoid the NDK Clang
          # precompiled-header path that crashed during generated-code builds.
          HXCPP_COMPILE_THREADS: "1"
        run: |
          set -euo pipefail
          test "${HXCPP_COMPILE_THREADS}" = "1"
          haxelib run lime build android -v -debug -DGITHUB_BUILD -DNO_PRECOMPILED_HEADERS

      - name: Verify Android APK
        shell: bash
        working-directory: upstream/Funkin
        run: |
          set -euo pipefail
          apk="$(find export -type f -name '*.apk' ! -name 'NovaBeat-Android.apk' -print -quit)"
          test -n "$apk"
          test -s "$apk"
          cp "$apk" export/NovaBeat-Android.apk
          test -s export/NovaBeat-Android.apk
          digest="$(sha256sum export/NovaBeat-Android.apk | awk '{print $1}')"
          {
            echo "## Android mobile build succeeded"
            echo
            echo "- Output: export/NovaBeat-Android.apk"
            echo "- SHA-256: `$digest`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android package for automatic release publishing
        uses: actions/upload-artifact@v4
        with:
          name: novabeat-android
          path: upstream/Funkin/export/NovaBeat-Android.apk
          if-no-files-found: error
          retention-days: 3


# Android validation trigger: [full-build-android] (NDK r25c compiler comparison)
