name: NovaBeat cached Windows republish

on:
  push:
    branches: ["integration/**"]
    paths:
      - ".github/workflows/republish-cached-windows.yml"

permissions:
  actions: read
  contents: read

jobs:
  republish:
    if: contains(github.event.head_commit.message, '[republish-windows]')
    runs-on: windows-2022
    steps:
      - name: Download the already-built Windows artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: DanielVr124/NovaBeat-Engine
          run_id: 43676487946
          name: novabeat-windows
          path: extracted-windows

      - name: Verify existing executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (!(Test-Path "extracted-windows/bin/Funkin.exe") -and !(Test-Path "extracted-windows/Funkin.exe")) {
            Get-ChildItem extracted-windows -Recurse | Select-Object -First 40 FullName
            throw "The downloaded artifact does not contain Funkin.exe; refusing to publish."
          }
          "Repackaging the original successful build. No compilation or game build steps are run." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload compressed Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: novabeat-windows
          path: extracted-windows/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
