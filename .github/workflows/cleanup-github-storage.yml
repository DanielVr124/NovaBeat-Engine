name: One-time GitHub storage cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-github-storage.yml

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Clear completed build artifacts, caches, and duplicate releases
        shell: bash
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          BUILDS_TOKEN: ${{ secrets.NOVABEAT_BUILDS_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          BUILDS_REPO: DanielVr124/NovaBeat-Builds
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execFileSync } = require('node:child_process');

          const ACTIONS_TOKEN = process.env.ACTIONS_TOKEN;
          const BUILDS_TOKEN = process.env.BUILDS_TOKEN;
          const SOURCE_REPO = process.env.SOURCE_REPO;
          const BUILDS_REPO = process.env.BUILDS_REPO;
          const protectedWorkflows = new Set([
            'NovaBeat platform build checks',
            'NovaBeat HTML5 browser test build',
            'Publish NovaBeat build releases'
          ]);

          function api(token, method, endpoint) {
            const result = execFileSync('gh', ['api', '--method', method, endpoint], {
              encoding: 'utf8',
              maxBuffer: 100 * 1024 * 1024,
              env: { ...process.env, GH_TOKEN: token },
              stdio: ['ignore', 'pipe', 'pipe']
            });
            if (!result.trim()) return null;
            try { return JSON.parse(result); } catch { return result; }
          }

          function listAll(token, endpoint, key) {
            const values = [];
            for (let page = 1; page <= 50; page++) {
              const data = api(token, 'GET', endpoint + '?per_page=100&page=' + page);
              const rows = Array.isArray(data) ? data : (data && data[key]) || [];
              values.push(...rows);
              if (rows.length < 100) return values;
            }
            throw new Error('Pagination safety limit reached for ' + endpoint);
          }

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const formatGiB = bytes => (bytes / 1073741824).toFixed(2) + ' GiB';

          async function main() {
            // Do not remove artifacts while a NovaBeat build or publisher is still running.
            let settled = false;
            let active = [];
            for (let attempt = 0; attempt < 60; attempt++) {
              const runData = api(ACTIONS_TOKEN, 'GET',
                'repos/' + SOURCE_REPO + '/actions/runs?per_page=100&page=1');
              active = (runData.workflow_runs || []).filter(run =>
                protectedWorkflows.has(run.name) &&
                (run.status === 'queued' || run.status === 'in_progress')
              );
              if (active.length === 0) {
                settled = true;
                break;
              }
              console.log('Waiting for active NovaBeat build/publish jobs: ' +
                active.map(run => run.name + ' #' + run.run_number + ' (' + run.status + ')').join(', '));
              await sleep(10000);
            }

            let deletedArtifacts = 0;
            let artifactBytes = 0;
            let deletedCaches = 0;
            let cacheBytes = 0;

            if (settled) {
              const artifacts = listAll(ACTIONS_TOKEN,
                'repos/' + SOURCE_REPO + '/actions/artifacts', 'artifacts');
              console.log('Found ' + artifacts.length + ' Actions artifacts in ' + SOURCE_REPO + '.');
              for (const artifact of artifacts) {
                if (artifact.expired) continue;
                api(ACTIONS_TOKEN, 'DELETE',
                  'repos/' + SOURCE_REPO + '/actions/artifacts/' + artifact.id);
                deletedArtifacts++;
                artifactBytes += Number(artifact.size_in_bytes || 0);
                console.log('Deleted Actions artifact: ' + artifact.name + ' (' +
                  formatGiB(Number(artifact.size_in_bytes || 0)) + ')');
              }

              try {
                const caches = listAll(ACTIONS_TOKEN,
                  'repos/' + SOURCE_REPO + '/actions/caches', 'actions_caches');
                console.log('Found ' + caches.length + ' Actions caches.');
                for (const cache of caches) {
                  api(ACTIONS_TOKEN, 'DELETE',
                    'repos/' + SOURCE_REPO + '/actions/caches/' + cache.id);
                  deletedCaches++;
                  cacheBytes += Number(cache.size_in_bytes || 0);
                }
              } catch (error) {
                console.log('Cache cleanup was unavailable or no caches were present: ' +
                  String(error.message || error));
              }
            } else {
              console.log('Build/publish jobs did not settle within 10 minutes. ' +
                'Skipped artifact and cache deletion to protect any in-flight release.');
            }

            // Release assets do not count against GitHub Actions storage, but old duplicate
            // releases are clutter. Keep the newest release for each platform and any release
            // asset that has actually been downloaded. The Granny repository is not touched.
            if (!BUILDS_TOKEN) {
              console.log('NOVABEAT_BUILDS_TOKEN is unavailable; skipped release pruning.');
            } else {
              const releases = listAll(BUILDS_TOKEN,
                'repos/' + BUILDS_REPO + '/releases', null);
              const targetAssets = new Set([
                'NovaBeat-HTML5.zip',
                'NovaBeat-Windows.zip',
                'NovaBeat-Android.apk'
              ]);
              const candidates = releases.filter(release =>
                /^novabeat-/.test(release.tag_name || '') &&
                /^NovaBeat (?:build|Windows build) #\d+/.test(release.name || '') &&
                Array.isArray(release.assets) &&
                release.assets.length > 0 &&
                release.assets.every(asset => targetAssets.has(asset.name))
              );

              const latestByAsset = new Map();
              for (const release of candidates) {
                const timestamp = Date.parse(release.published_at || release.created_at || '') || 0;
                for (const asset of release.assets) {
                  const previous = latestByAsset.get(asset.name);
                  if (!previous || timestamp > previous.timestamp) {
                    latestByAsset.set(asset.name, { id: release.id, timestamp });
                  }
                }
              }
              for (const name of targetAssets) {
                if (!latestByAsset.has(name)) {
                  throw new Error('Safety stop: no release found for platform asset ' + name +
                    '; no releases were deleted.');
                }
              }

              const keepIds = new Set([...latestByAsset.values()].map(item => item.id));
              for (const release of candidates) {
                if (release.assets.some(asset => Number(asset.download_count || 0) > 0)) {
                  keepIds.add(release.id);
                }
              }

              const toDelete = candidates.filter(release => !keepIds.has(release.id));
              let deletedReleases = 0;
              let releaseBytes = 0;
              for (const release of toDelete) {
                api(BUILDS_TOKEN, 'DELETE',
                  'repos/' + BUILDS_REPO + '/releases/' + release.id);
                deletedReleases++;
                releaseBytes += release.assets.reduce((sum, asset) =>
                  sum + Number(asset.size || 0), 0);
              }

              console.log('Release cleanup: kept ' + keepIds.size +
                ' releases (latest HTML5/Windows/Android plus previously downloaded builds); deleted ' +
                deletedReleases + ' duplicate releases (' + formatGiB(releaseBytes) + ' of release assets).');
            }

            console.log('Actions cleanup: deleted ' + deletedArtifacts + ' artifacts (' +
              formatGiB(artifactBytes) + ') and ' + deletedCaches + ' caches (' +
              formatGiB(cacheBytes) + ').');
          }

          main().catch(error => {
            console.error(error.stack || error);
            process.exit(1);
          });
          NODE
