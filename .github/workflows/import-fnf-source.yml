name: Import official FNF 0.8.6 source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-fnf-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out NovaBeat
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the exact FNF 0.8.6 source revision
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/FunkinCrew/Funkin.git /tmp/funkin-upstream
          git -C /tmp/funkin-upstream fetch --depth=1 origin ee9d492becfc1178b2c80487167d09a880f90146
          git -C /tmp/funkin-upstream checkout --detach FETCH_HEAD
          actual="$(git -C /tmp/funkin-upstream rev-parse HEAD)"
          expected="ee9d492becfc1178b2c80487167d09a880f90146"
          test "$actual" = "$expected"
          echo "FNF_SOURCE_COMMIT=$actual" >> "$GITHUB_ENV"
          echo "FNF_ASSETS_COMMIT=$(git -C /tmp/funkin-upstream ls-tree HEAD assets | awk '{print $3}')" >> "$GITHUB_ENV"
          echo "FNF_ART_COMMIT=$(git -C /tmp/funkin-upstream ls-tree HEAD art | awk '{print $3}')" >> "$GITHUB_ENV"

      - name: Vendor source files into NovaBeat and retain asset submodule pins
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Replace the top-level FNF source submodule with ordinary tracked files.
          git rm -f upstream/Funkin
          mkdir -p upstream/Funkin
          rsync -a --exclude='.git' --exclude='assets' --exclude='art' /tmp/funkin-upstream/ upstream/Funkin/

          # FNF keeps artwork and assets in separately licensed upstream repos.
          # Keep their exact upstream gitlink commits instead of copying their contents.
          test -n "$FNF_ASSETS_COMMIT"
          test -n "$FNF_ART_COMMIT"
          git update-index --add --cacheinfo "160000,$FNF_ASSETS_COMMIT,upstream/Funkin/assets"
          git update-index --add --cacheinfo "160000,$FNF_ART_COMMIT,upstream/Funkin/art"

          cat > .gitmodules <<'EOF'
          [submodule "Funkin-assets"]
          	path = upstream/Funkin/assets
          	url = https://github.com/FunkinCrew/Funkin.assets.git
          [submodule "Funkin-art"]
          	path = upstream/Funkin/art
          	url = https://github.com/FunkinCrew/Funkin.art.git
          EOF

          cat > docs/SOURCE_IMPORT.md <<EOF
          # Vendored upstream source

          The official Friday Night Funkin' v0.8.6 source files are stored directly in this repository at `upstream/Funkin/`.

          - Upstream: https://github.com/FunkinCrew/Funkin
          - Version: v0.8.6
          - Exact source commit: `$FNF_SOURCE_COMMIT`

          This is a vendored source tree, not a link to a fork or a source submodule. The engine code, project files, build scripts, documentation, and upstream license notices are ordinary files committed in NovaBeat.

          ## Artwork and asset repositories

          Upstream FNF stores `assets` and `art` in separate repositories. They remain pinned as Git submodules at the exact revisions recorded by FNF v0.8.6, because they have separate licensing terms.

          To fetch those two submodules after cloning:

          ```bash
          git submodule update --init --recursive
          ```

          Or clone NovaBeat and initialize them in one step:

          ```bash
          git clone --recurse-submodules https://github.com/DanielVr124/NovaBeat-Engine.git
          ```

          ## Build status

          Importing source does not mean the project has been compiled or tested. Follow `upstream/Funkin/docs/COMPILING.md` for desktop setup and `upstream/Funkin/docs/COMPILING_MOBILE.md` for mobile setup. NovaBeat's Windows build, Android build, Android portrait/landscape UI, Mod Manager integration, and regression tests still require implementation and verification.

          ## Licensing

          FNF source code includes its upstream Apache-2.0 license notice in `upstream/Funkin/LICENSE.md`. The separate `assets` and `art` repositories have their own licenses. Retain the upstream notices and do not redistribute material from those repositories unless their applicable licenses permit it.
          EOF

          cat > README.md <<EOF
          # Friday Night Funkin': NovaBeat Engine

          **A New Rhythm. A New Experience.**

          NovaBeat Engine is an unofficial community engine project based on Friday Night Funkin'. The goal is to expand the game with a polished native mod manager, more flexible gameplay and audio systems, creator tools, richer presentation, and quality-of-life improvements.

          ## Platform targets

          - **Windows PC**
          - **Android phones and tablets**, with both portrait and landscape layouts

          iOS is intentionally outside the project scope. NovaBeat does not plan to ship a separate launcher; it remains a game you launch directly.

          ## Project priorities

          1. Establish a reliable Windows and Android source/build foundation.
          2. Deliver a native in-game Mod Manager.
          3. Build a safe, extensible mod and gameplay API.
          4. Add player-facing gameplay, audio, and presentation features.
          5. Expand the creator toolchain.
          6. Polish accessibility, performance, and diagnostics.

          See [ROADMAP.md](ROADMAP.md), [docs/APPROVED_BACKLOG.md](docs/APPROVED_BACKLOG.md), and [docs/SOURCE_IMPORT.md](docs/SOURCE_IMPORT.md).

          ## Source repository

          The complete FNF v0.8.6 **source code is stored directly in this repository** under `upstream/Funkin/`, pinned to upstream commit `$FNF_SOURCE_COMMIT`. This is a vendored copy of the source tree, not a fork or source submodule.

          The separately licensed upstream `assets` and `art` repositories remain pinned as submodules. Run `git submodule update --init --recursive` to fetch them, or use `git clone --recurse-submodules` when cloning NovaBeat.

          The source import does **not** mean NovaBeat is already buildable. Windows and Android dependency setup, baseline compilation, Mod Manager integration, and regression testing still need to be completed.

          ## Development status

          Roadmap and approved backlog entries are proposals until their implementation is reviewed, compiled, and tested. Windows and Android remain the only targets; Android must support both portrait and landscape.

          ## Upstream and licensing

          NovaBeat is an unofficial community project and is not affiliated with or endorsed by The Funkin' Crew Inc. Friday Night Funkin' and its original code, artwork, audio, and trademarks remain subject to their respective copyright and license terms.

          The upstream source code is licensed under Apache-2.0; retain its notice in `upstream/Funkin/LICENSE.md`. The separate `assets` and `art` repositories have their own licensing terms. The source-code license does not automatically grant permission to redistribute those materials.

          - Upstream source: https://github.com/FunkinCrew/Funkin
          - Upstream release: https://github.com/FunkinCrew/Funkin/releases/tag/v0.8.6
          - Modding documentation: https://funkincrew.github.io/funkin-modding-docs/
          EOF

          git add -A .gitmodules README.md docs/SOURCE_IMPORT.md upstream/Funkin
          git commit -m "Vendor complete FNF 0.8.6 source tree"
          git push origin HEAD:main
