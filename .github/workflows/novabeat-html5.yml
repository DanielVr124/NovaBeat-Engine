name: NovaBeat HTML5 browser test build
# [web-build] Validate Linux Haxe tool-cache priming before browser compilation.
# [web-build] Verify Story Mode clipping/bop timing, browser mobile controls, customization input, and hidden cursor.
# [web-build] User-requested HTML5-only build of the current mobile touch-control changes.
# [web-build] User-requested rebuild of the latest mobile browser test build.

# Separate experimental browser build. Native Windows/Android builds remain unchanged.
# [web-build] Rebuild the browser test site from the latest compiler-fixed source.
# [web-build] User-requested HTML5 verification build for the current feature branch.
# [web-build] Fresh HTML5 rebuild requested after the Pages retry failed.
# Quest mobile-controls validation build requested for the current feature branch.
# [web-build] Verify Story Mode, NovaBeat menu, FNF settings, and mobile tap fixes.
# Single long-lived integration branch: feature/optional-novabeat-menu-mod-manager.
# Keep NovaBeat feature work on that branch; main remains the release/production branch.
# Only main and the integration branch publish to GitHub Pages; PR-only builds never deploy.
# Watched pushes to the integration branch build and publish; PR-only builds remain opt-in.
on:
  workflow_dispatch:
  push:
    branches: [main, "feature/optional-novabeat-menu-mod-manager"]
    paths:
      - ".gitmodules"
      - "upstream/Funkin/**"
      - "novabeat-assets/**"
      - ".github/workflows/novabeat-html5.yml"
      - "docs/HTML5_TESTING.md"
      - "README.md"
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - ".gitmodules"
      - "upstream/Funkin/**"
      - "novabeat-assets/**"
      - ".github/workflows/novabeat-html5.yml"
      - "docs/HTML5_TESTING.md"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: novabeat-html5-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  html5:
    outputs:
      pages_deployable: ${{ steps.pages-payload.outputs.deployable }}
    # Any watched change pushed to the integration branch must build and publish.
    # PR checks remain opt-in via [web-build] in the PR title; workflow_dispatch
    # remains available for a deliberate rebuild without changing source files.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/optional-novabeat-menu-mod-manager')) || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[web-build]'))
    name: HTML5 browser test build
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out NovaBeat and pinned FNF asset repositories
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Restore Neko 2.4.0 tool cache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/neko/2.4.0
          key: ${{ runner.os }}-${{ runner.arch }}-neko-2.4.0-v1
          save-always: true

      - name: Prime Neko tool cache with extended download retries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tool_cache="${RUNNER_TOOL_CACHE:?RUNNER_TOOL_CACHE is not set}"
          neko_root="$tool_cache/neko/2.4.0"
          neko_path="$neko_root/x64"

          if [[ -x "$neko_path/neko" && -f "$neko_root/x64.complete" ]]; then
            echo "Neko 2.4.0 is already restored from the runner tool cache."
            exit 0
          fi

          archive="$RUNNER_TEMP/neko-2.4.0-linux64.tar.gz"
          extract="$RUNNER_TEMP/neko-2.4.0-extract"
          rm -rf "$extract"
          mkdir -p "$extract"

          # setup-haxe v2 retries transient downloads three times. Neko's release
          # endpoint has repeatedly returned HTTP 504 in CI, so prime the exact
          # actions/tool-cache location with a longer retry window first.
          curl -fL --retry 12 --retry-all-errors --retry-delay 5 --retry-max-time 900 \
            "https://github.com/HaxeFoundation/neko/releases/download/v2-4-0/neko-2.4.0-linux64.tar.gz" \
            -o "$archive"

          tar -xzf "$archive" -C "$extract"
          archive_root="$(find "$extract" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$archive_root"
          test -x "$archive_root/neko"

          mkdir -p "$neko_root"
          rm -rf "$neko_path"
          cp -a "$archive_root" "$neko_path"
          touch "$neko_root/x64.complete"
          echo "$neko_path" >> "$GITHUB_PATH"

      - name: Restore Haxe 4.3.7 tool cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/haxe/4.3.7
          key: ${{ runner.os }}-${{ runner.arch }}-haxe-4.3.7-v1
          save-always: true

      - name: Prime Linux Haxe tool cache with extended download retries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tool_cache="${RUNNER_TOOL_CACHE:?RUNNER_TOOL_CACHE is not set}"
          haxe_root="$tool_cache/haxe/4.3.7"
          haxe_path="$haxe_root/x64"

          if [[ -x "$haxe_path/haxe" && -d "$haxe_path/std" && -f "$haxe_root/x64.complete" ]]; then
            echo "Haxe 4.3.7 is already restored from the runner tool cache."
            exit 0
          fi

          archive="$RUNNER_TEMP/haxe-4.3.7-linux64.tar.gz"
          extract="$RUNNER_TEMP/haxe-4.3.7-extract"
          rm -rf "$extract"
          mkdir -p "$extract"

          # setup-haxe v2 retries downloads three times for at most 90 seconds.
          # The Haxe release asset has repeatedly returned HTTP 504 in CI, so
          # download with a longer retry window and prime actions/tool-cache's
          # exact haxe/<version>/x64 layout before setup-haxe runs.
          curl -fL --retry 12 --retry-all-errors --retry-delay 5 --retry-max-time 900 \
            "https://github.com/HaxeFoundation/haxe/releases/download/4.3.7/haxe-4.3.7-linux64.tar.gz" \
            -o "$archive"

          tar -xzf "$archive" -C "$extract"
          haxe_binary="$(find "$extract" -type f -name haxe -print -quit)"
          test -n "$haxe_binary"
          haxe_source="$(dirname "$haxe_binary")"
          test -d "$haxe_source/std"

          mkdir -p "$haxe_root"
          rm -rf "$haxe_path"
          mkdir -p "$haxe_path"
          cp -a "$haxe_source/." "$haxe_path/"
          test -x "$haxe_path/haxe"
          test -d "$haxe_path/std"
          touch "$haxe_root/x64.complete"
          echo "$haxe_path" >> "$GITHUB_PATH"

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: "4.3.7"

      - name: Locate global Haxe library repository
        id: haxelib-cache-path
        shell: bash
        run: |
          set -euo pipefail
          haxelib_repo="$(haxelib config)"
          test -n "$haxelib_repo"
          echo "path=$haxelib_repo" >> "$GITHUB_OUTPUT"

      - name: Restore Haxe libraries and Lime tool caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.haxelib-cache-path.outputs.path }}
            upstream/Funkin/.haxelib
            ~/.lime
          key: ${{ runner.os }}-haxe-4.3.7-${{ hashFiles('upstream/Funkin/hmm.json') }}

      - name: Confirm source and pinned content repositories
        shell: bash
        run: |
          set -euo pipefail
          test -f upstream/Funkin/source/Main.hx
          test -f upstream/Funkin/project.hxp
          test -f upstream/Funkin/LICENSE.md
          test -f upstream/Funkin/assets/LICENSE.md
          test -f upstream/Funkin/art/LICENSE.md

      - name: Configure patched Haxe libraries and install pinned dependencies
        shell: bash
        working-directory: upstream/Funkin
        run: |
          set -euo pipefail
          haxelib fixrepo --global || true
          haxelib --debug --never --global install haxelib 4.1.0
          haxelib --debug --never --global set haxelib 4.1.0
          haxelib --global remove haxelib git || true
          haxelib --global remove hmm || true
          haxelib --debug --never --global git haxelib https://github.com/FunkinCrew/haxelib.git funkin-patches --skip-dependencies
          haxelib --debug --never --global git hmm https://github.com/FunkinCrew/hmm funkin-patches
          if [[ ! -d .haxelib ]]; then
            haxelib --debug --never newrepo
          fi
          haxelib --global run hmm install -q

      - name: Restore Linux APT package cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/novabeat-apt-cache/archives
            ${{ runner.temp }}/novabeat-apt-cache/lists
          # Bump v1 when the Linux package set changes materially.
          key: ${{ runner.os }}-ubuntu-24.04-novabeat-apt-v1
          restore-keys: |
            ${{ runner.os }}-ubuntu-24.04-novabeat-apt-

      - name: Install missing SDL, Lime, and audio build dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt_cache_root="$RUNNER_TEMP/novabeat-apt-cache"
          apt_archives="$apt_cache_root/archives"
          apt_lists="$apt_cache_root/lists"
          mkdir -p "$apt_archives/partial" "$apt_lists/partial"
          chmod -R a+rwX "$apt_cache_root"

          apt_options=(
            -o "Dir::Cache::archives=$apt_archives"
            -o "Dir::State::lists=$apt_lists"
          )
          packages=(
            build-essential g++ gcc g++-multilib gcc-multilib git make pkg-config cmake ninja-build
            libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxinerama-dev
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libglu1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libvulkan-dev
            libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev
            libpipewire-0.3-dev libspa-0.2-dev libwayland-dev libwayland-bin wayland-protocols libdecor-0-dev liburing-dev
            ffmpeg
          )
          missing_packages=()
          for package in "${packages[@]}"; do
            installed_status="$(dpkg-query -W -f='${db:Status-Status}' "$package" 2>/dev/null || true)"
            if [[ "$installed_status" != "installed" ]]; then
              missing_packages+=("$package")
            fi
          done

          if (("${#missing_packages[@]}" > 0)); then
            echo "Installing ${#missing_packages[@]} missing Linux packages: ${missing_packages[*]}"
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y "${missing_packages[@]}"
          else
            echo "All SDL, Lime, and audio build packages are already installed; skipping APT."
          fi

          for header in \
            /usr/include/X11/extensions/scrnsaver.h \
            /usr/include/libudev.h \
            /usr/include/wayland-client.h \
            /usr/include/alsa/asoundlib.h \
            /usr/include/pulse/pulseaudio.h; do
            if [[ ! -f "$header" ]]; then
              echo "::error title=Missing SDL development header::$header was not installed"
              exit 1
            fi
          done
          pkg-config --exists libpipewire-0.3 libudev wayland-client alsa libpulse
          cat <<'EOF' | cc $(pkg-config --cflags libpipewire-0.3) -x c -fsyntax-only -
          #include <pipewire/pipewire.h>
          EOF
          command -v wayland-scanner
          wayland-scanner --version
          command -v ffmpeg
          sudo chown -R "$(id -u):$(id -g)" "$apt_cache_root"
          chmod -R u+rwX,go+rX "$apt_cache_root"

      - name: Prepare NovaBeat browser audio assets
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null 2>&1 || {
            echo "::error title=FFmpeg missing::FFmpeg should have been installed by the Linux dependency step."
            exit 1
          }
          while IFS= read -r -d '' input; do
            output="${input%.ogg}.mp3"
            ffmpeg -nostdin -hide_banner -loglevel error -y -i "$input" -vn -codec:a libmp3lame -q:a 3 "$output"
          done < <(find novabeat-assets -type f -name '*.ogg' -print0)
          test -s novabeat-assets/music/novabeat-menu/novabeat-menu.mp3
          for sound in enter back confirm select; do
            test -s "novabeat-assets/sounds/novabeat/${sound}.mp3"
          done
      - name: Compile HXCPP support tools required by Lime
        shell: bash
        working-directory: upstream/Funkin
        run: |
          set -euo pipefail
          cd .haxelib/hxcpp/git/tools/hxcpp
          haxe compile.hxml

      - name: Build Lime native support tools
        timeout-minutes: 45
        shell: bash
        working-directory: upstream/Funkin
        run: |
          set -euo pipefail
          haxelib run lime rebuild cpp -64

      # The upstream asset repository includes ~144 MiB of cutscene videos.
      # They are not needed to validate menu/touch input, and GitHub Pages
      # times out while syncing the full video-inclusive preview.
      # Keep all songs and audio; disable only video playback for this web preview.
      - name: Exclude cutscene videos from the HTML5 preview
        shell: bash
        working-directory: upstream/Funkin
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          project = Path("project.hxp")
          source = 'FEATURE_VIDEO_PLAYBACK.apply(this, true);'
          replacement = 'FEATURE_VIDEO_PLAYBACK.apply(this, false);'
          content = project.read_text(encoding="utf-8")
          count = content.count(source)
          if count != 1:
              raise SystemExit(
                  f"Expected exactly one upstream video feature flag in {project}, found {count}"
              )
          project.write_text(content.replace(source, replacement, 1), encoding="utf-8")
          print("Cutscene video assets disabled for this HTML5 preview build; song/audio assets remain enabled.")
          PY

      - name: Build HTML5 release
        shell: bash
        working-directory: upstream/Funkin
        run: |
          set -euo pipefail
          haxelib run lime build html5 -v -release -DGITHUB_BUILD

      - name: Bundle Fengari for browser Lua scripts
        shell: bash
        working-directory: upstream/Funkin
        run: |
          set -euo pipefail
          npm pack fengari-web@0.1.4 --silent
          mkdir -p "$RUNNER_TEMP/novabeat-fengari"
          tar -xzf fengari-web-0.1.4.tgz -C "$RUNNER_TEMP/novabeat-fengari"
          index_file="$(find export -type f -name index.html -print -quit)"
          test -n "$index_file"
          web_root="$(dirname "$index_file")"
          cp "$RUNNER_TEMP/novabeat-fengari/package/dist/fengari-web.js" "$web_root/fengari-web.js"
          test -s "$web_root/fengari-web.js"

      - name: Verify and package browser build
        id: package-web
        shell: bash
        working-directory: upstream/Funkin
        run: |
          set -euo pipefail

          index_file="$(find export -type f -name index.html -print -quit)"
          if [[ -z "$index_file" ]]; then
            echo "::error title=HTML5 output missing::Lime completed without producing an index.html. Inspect the build log above."
            find export -maxdepth 5 -type f -print 2>/dev/null | head -200 || true
            exit 1
          fi

          web_root="$(dirname "$index_file")"
          test -s "$index_file"
          # Give mobile browsers an edge-to-edge viewport without changing
          # desktop cursor or layout behavior.
          python3 - "$index_file" <<'PY'
          from pathlib import Path
          import re
          import sys

          index = Path(sys.argv[1])
          html = index.read_text(encoding="utf-8")
          viewport = '<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">'
          viewport_pattern = r"""<meta\s+name=["']viewport["'][^>]*>"""
          if re.search(viewport_pattern, html, re.I):
              html = re.sub(viewport_pattern, viewport, html, count=1, flags=re.I)
          elif "</head>" in html:
              html = html.replace("</head>", viewport + "</head>", 1)

          style = """<style id="novabeat-mobile-viewport">
          @media (hover:none) and (pointer:coarse) {
            html,body{margin:0!important;padding:0!important;width:100%!important;height:100%!important;min-height:100%!important;overflow:hidden!important;overscroll-behavior:none!important}
            #openfl-content{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;max-width:none!important;max-height:none!important;overflow:hidden!important}
            #openfl-content canvas,canvas{display:block!important}
            html,body,canvas,#openfl-content{cursor:none!important;touch-action:none!important;-webkit-user-select:none!important;user-select:none!important}
          }
          </style>"""
          if "novabeat-mobile-viewport" not in html:
              html = html.replace("</head>", style + "</head>", 1) if "</head>" in html else style + html

          # Load Fengari before the generated Haxe bundle so vm.lua can resolve
          # the fengari global on browsers without a JavaScript module loader.
          fengari_script = '<script src="./fengari-web.js"></script>'
          if "fengari-web.js" not in html and "</head>" in html:
              html = html.replace("</head>", fengari_script + "</head>", 1)

          # Keep service-worker registration in index.html itself so offline
          # reloads can install/update the worker after the page is restored.
          registration = """<script>
          if ("serviceWorker" in navigator && location.protocol !== "file:") {
            window.addEventListener("load", () => {
              navigator.serviceWorker.register("./service-worker.js", {scope: "./", updateViaCache: "none"})
                .catch(error => console.warn("NovaBeat offline cache unavailable:", error));
            }, {once: true});
          }
          </script>"""
          if "service-worker.js" not in html:
              html = html.replace("</body>", registration + "</body>") if "</body>" in html else html + registration
          index.write_text(html, encoding="utf-8")
          PY
          # Hash the full output, then copy unchanged assets from the previous
          # cache and download only changed/missing files. Songs stay included.
          python3 - "$web_root" "${GITHUB_SHA}" <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json
          import os
          import sys

          root = Path(sys.argv[1])
          version = sys.argv[2]

          # Hash the final HTML document, including the worker registration.
          # Otherwise an offline navigation can restore an index without the
          # script that registers or updates the service worker.
          index = root / "index.html"
          html = index.read_text(encoding="utf-8")
          registration = """<script>
          if ("serviceWorker" in navigator && location.protocol !== "file:") {
            window.addEventListener("load", () => {
              navigator.serviceWorker.register("./service-worker.js", {scope: "./", updateViaCache: "none"})
                .catch(error => console.warn("NovaBeat offline cache unavailable:", error));
            }, {once: true});
          }
          </script>"""
          if "service-worker.js" not in html:
              html = html.replace("</body>", registration + "</body>") if "</body>" in html else html + registration
              index.write_text(html, encoding="utf-8")

          def digest_file(path: Path) -> str:
              digest = sha256()
              with path.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          assets = []
          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.name in {"service-worker.js", ".nojekyll"}:
                  continue
              assets.append({
                  "path": "./" + path.relative_to(root).as_posix(),
                  "sha256": digest_file(path)
              })

          song_assets = [asset for asset in assets if asset["path"].startswith("./assets/songs/")]
          if not song_assets:
              raise SystemExit("HTML5 output has no assets/songs files; refusing to publish an incomplete offline build.")

          worker = """const CACHE_PREFIX = "novabeat-static-";
          const CACHE_NAME = CACHE_PREFIX + VERSION;
          const ASSETS = ASSET_LIST;
          const MANIFEST_URL = new URL("__novabeat_asset_manifest.json", self.registration.scope).href;

          function canonicalURL(value) {
            const url = new URL(typeof value === "string" ? value : value.url, self.registration.scope);
            url.search = "";
            url.hash = "";
            return url.href;
          }

          async function findPreviousCache() {
            const names = (await caches.keys()).filter(name => name.startsWith(CACHE_PREFIX) && name !== CACHE_NAME).reverse();
            for (const name of names) {
              const cache = await caches.open(name);
              const response = await cache.match(MANIFEST_URL);
              if (response) {
                try { return {cache, manifest: await response.json()}; } catch (_) {}
              }
              // Previous worker versions did not store hashes. Keep a handle
              // so ETag validation can avoid fetching unchanged large media.
              return {cache, manifest: null};
            }
            return null;
          }

          async function getPreviousResponse(previous, key, expectedHash) {
            if (!previous) return null;
            const response = await previous.cache.match(key, {ignoreSearch: true});
            // Older workers could accidentally store a 206 byte-range response
            // under the full asset URL. Never promote that partial body into
            // the next version's complete offline cache.
            if (!response || response.status !== 200) return null;

            if (previous.manifest) {
              return previous.manifest[key] === expectedHash ? response : null;
            }

            const etag = response.headers.get("ETag");
            if (!etag) return null;
            const validation = await fetch(new Request(key, {
              method: "HEAD",
              headers: {"If-None-Match": etag},
              cache: "no-store"
            }));
            if (validation.status === 304 || validation.headers.get("ETag") === etag) return response;
            return null;
          }

          self.addEventListener("install", event => {
            event.waitUntil((async () => {
              const cache = await caches.open(CACHE_NAME);
              const previous = await findPreviousCache();
              const nextManifest = {};
              try {
                // Small batches avoid a single giant addAll burst on phones.
                for (let offset = 0; offset < ASSETS.length; offset += 6) {
                  const batch = ASSETS.slice(offset, offset + 6);
                  await Promise.all(batch.map(async asset => {
                    const key = canonicalURL(asset.path);
                    nextManifest[key] = asset.sha256;
                    const oldResponse = await getPreviousResponse(previous, key, asset.sha256);
                    if (oldResponse) {
                      await cache.put(key, oldResponse.clone());
                      return;
                    }
                    const response = await fetch(new Request(key, {cache: "reload"}));
                    if (!response.ok) throw new Error("Failed to cache " + key + " (" + response.status + ")");
                    await cache.put(key, response.clone());
                  }));
                }

                await cache.put(MANIFEST_URL, new Response(JSON.stringify(nextManifest), {
                  headers: {"Content-Type": "application/json"}
                }));
                await self.skipWaiting();
              } catch (error) {
                await caches.delete(CACHE_NAME);
                throw error;
              }
            })());
          });

          self.addEventListener("activate", event => {
            event.waitUntil((async () => {
              const names = await caches.keys();
              await Promise.all(names.filter(name => name.startsWith(CACHE_PREFIX) && name !== CACHE_NAME).map(name => caches.delete(name)));
              await self.clients.claim();
            })());
          });

          async function makeHeadResponse(fullResponse) {
            const blob = await fullResponse.clone().blob();
            const headers = new Headers(fullResponse.headers);
            headers.set("Accept-Ranges", "bytes");
            headers.set("Content-Length", String(blob.size));
            headers.delete("Content-Encoding");
            headers.delete("Transfer-Encoding");
            return new Response(null, {
              status: fullResponse.status,
              statusText: fullResponse.statusText,
              headers
            });
          }

          async function makeRangeResponse(fullResponse, rangeHeader) {
            // FlxPartialSound sends single byte ranges for Freeplay previews.
            // Multiple ranges are intentionally left to the network fallback.
            const match = /^bytes=([0-9]*)-([0-9]*)$/i.exec(rangeHeader.trim());
            if (!match) return null;

            const blob = await fullResponse.clone().blob();
            const total = blob.size;
            const first = match[1];
            const last = match[2];
            let start;
            let end;

            if (first === "") {
              const suffixLength = Number(last);
              if (!Number.isFinite(suffixLength) || suffixLength <= 0 || total <= 0) {
                return new Response(null, {
                  status: 416,
                  headers: {"Content-Range": "bytes */" + total, "Accept-Ranges": "bytes"}
                });
              }
              start = Math.max(0, total - suffixLength);
              end = total - 1;
            } else {
              start = Number(first);
              end = last === "" ? total - 1 : Number(last);
              if (!Number.isFinite(start) || !Number.isFinite(end) || start < 0 || end < start || start >= total) {
                return new Response(null, {
                  status: 416,
                  headers: {"Content-Range": "bytes */" + total, "Accept-Ranges": "bytes"}
                });
              }
              end = Math.min(end, total - 1);
            }

            const partialBlob = blob.slice(start, end + 1);
            const headers = new Headers(fullResponse.headers);
            headers.set("Accept-Ranges", "bytes");
            headers.set("Content-Range", "bytes " + start + "-" + end + "/" + total);
            headers.set("Content-Length", String(partialBlob.size));
            headers.delete("Content-Encoding");
            headers.delete("Transfer-Encoding");
            return new Response(partialBlob, {
              status: 206,
              statusText: "Partial Content",
              headers
            });
          }

          self.addEventListener("fetch", event => {
            const request = event.request;
            const requestURL = new URL(request.url);
            if ((request.method !== "GET" && request.method !== "HEAD") || requestURL.origin !== self.location.origin) return;
            event.respondWith((async () => {
              const cache = await caches.open(CACHE_NAME);
              const key = canonicalURL(request);
              const rangeHeader = request.headers.get("Range");
              const cached = await cache.match(key, {ignoreSearch: true});
              if (cached) {
                // The song preview decoder asks for HEAD plus one or more
                // Range GETs. Satisfy both from the pre-cached complete file,
                // rather than forcing a network request or returning the
                // entire MP3/Ogg file for a range request.
                if (request.method === "HEAD") return makeHeadResponse(cached);
                if (rangeHeader) {
                  const partial = await makeRangeResponse(cached, rangeHeader);
                  if (partial != null) return partial;
                }
                return cached;
              }
              try {
                const response = await fetch(request);
                // Never overwrite a complete song with a 206 partial response.
                if (request.method === "GET" && !rangeHeader && response.status === 200 && response.type === "basic")
                  await cache.put(key, response.clone());
                return response;
              } catch (error) {
                if (request.mode === "navigate") {
                  const offlinePage = await cache.match(new URL("./index.html", self.registration.scope).href, {ignoreSearch: true});
                  if (offlinePage) return offlinePage;
                }
                throw error;
              }
            })());
          });
          """
          worker = worker.replace("VERSION", json.dumps(version), 1)
          worker = worker.replace("ASSET_LIST", json.dumps(assets, separators=(",", ":")))
          (root / "service-worker.js").write_text(worker, encoding="utf-8")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as output:
                  output.write(f"\n- Offline precache includes {len(song_assets)} song audio files (instrumentals and vocals).\n")
          PY

          touch "$web_root/.nojekyll"
          echo "web_root=$web_root" >> "$GITHUB_OUTPUT"

          js_file="$(find "$web_root" -maxdepth 2 -type f -name '*.js' -print -quit)"
          if [[ -z "$js_file" ]]; then
            echo "::error title=JavaScript bundle missing::The HTML5 output has no JavaScript bundle."
            find "$web_root" -maxdepth 3 -type f -print | head -200 || true
            exit 1
          fi

          cat > "$web_root/NOVABEAT-WEB-TESTING.txt" <<'EOF'
          NovaBeat Engine — private HTML5 browser test build

          This is a static browser build of NovaBeat Engine. Extract the complete
          ZIP before running it; do not open index.html directly from File Explorer.

          Windows:
            1. Open PowerShell in this extracted folder.
            2. Run: py -m http.server 8000
            3. Open http://localhost:8000 in Chrome.

          macOS / Linux:
            1. Open a terminal in this extracted folder.
            2. Run: python3 -m http.server 8000
            3. Open http://localhost:8000 in your browser.

          Keep the local server terminal open while testing. Press Ctrl+C to stop it.

          Browser-only limitations may apply. Editors and features that depend on
          native desktop APIs are not expected to be available in this test build.
          Cutscene video playback is omitted from this web preview to keep the
          GitHub Pages download small enough to publish; song and music audio remain included.
          EOF

          package="$PWD/export/NovaBeat-HTML5.zip"
          mkdir -p "$(dirname "$package")"
          (cd "$web_root" && zip -qr "$package" .)
          test -s "$package"

          digest="$(sha256sum "$package" | awk '{print $1}')"
          {
            echo "## NovaBeat HTML5 browser build succeeded"
            echo
            echo "- Web root: $web_root"
            echo "- Package: upstream/Funkin/export/NovaBeat-HTML5.zip"
            echo "- SHA-256: `$digest`"
            echo "- Includes a local HTTP server quick-start guide."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Measure Pages payload and report largest files
        id: pages-payload
        shell: bash
        working-directory: upstream/Funkin
        env:
          WEB_ROOT: ${{ steps.package-web.outputs.web_root }}
        run: |
          set -euo pipefail
          payload_bytes="$(du -sb "$WEB_ROOT" | awk '{print $1}')"
          payload_mib="$((payload_bytes / 1048576))"
          echo "Expanded Pages payload: $payload_bytes bytes (${payload_mib} MiB)"

          {
            echo "## GitHub Pages payload inspection"
            echo
            echo "- Expanded site size: ${payload_mib} MiB ($payload_bytes bytes)"
            echo "- GitHub Pages published-site limit: 1 GB"
            echo
            echo "### Largest 25 files"
            find "$WEB_ROOT" -type f -printf '%s\t%p\n' | sort -nr | awk -F '\t' 'NR <= 25 {printf "- %.1f MiB — `%s`\n", $1 / 1048576, $2}'
          } >> "$GITHUB_STEP_SUMMARY"

          if (( payload_bytes >= 1000000000 )); then
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping GitHub Pages upload because the expanded site exceeds the 1 GB published-site limit."
            {
              echo
              echo "Pages deployment was skipped because the expanded output exceeds 1 GB."
              echo "The downloadable HTML5 ZIP is still generated and uploaded."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deployable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload browser files for GitHub Pages
        if: steps.pages-payload.outputs.deployable == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/optional-novabeat-menu-mod-manager') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v4
        with:
          path: upstream/Funkin/${{ steps.package-web.outputs.web_root }}
          include-hidden-files: true
          retention-days: 1

      - name: Upload HTML5 package for automatic release publishing
        uses: actions/upload-artifact@v4
        with:
          name: novabeat-html5
          path: upstream/Funkin/export/NovaBeat-HTML5.zip
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Publish HTML5 test site
    needs: html5
    if: needs.html5.outputs.pages_deployable == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/optional-novabeat-menu-mod-manager') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy browser build
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Report Pages deployment result
        if: always()
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [[ "$DEPLOY_OUTCOME" == "success" ]]; then
            {
              echo "## GitHub Pages deployment succeeded"
              echo
              echo "Published site: $PAGE_URL"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::The HTML5 build succeeded, but GitHub Pages did not finish publishing. The downloadable HTML5 artifact remains available."
            {
              echo "## GitHub Pages deployment did not complete"
              echo
              echo "This does not fail the HTML5 build. Download the `novabeat-html5` artifact from this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
